#:schema node_modules/wrangler/config-schema.json
name = "vpngate-test"
main = "worker.js"
compatibility_date = "2026-09-28"

# 说明：
#   1) 本项目是【单文件】Worker，全部逻辑都在 worker.js，
#      既可以用 wrangler 部署，也可以整段粘贴到 Cloudflare Dashboard 手动部署。
#   2) 下面的 [vars] 全部可省略；不写就用 worker.js 里的 DEFAULTS。
#   3) 修改变量后需要重新 `wrangler deploy`（或在 Dashboard 里改「变量和机密」）。
#   4) 部署步骤详见 DEPLOY.md。

[vars]
# VLESS 链接里的 UUID
# UUID = "495c7195-85b8-498a-bf20-2ea9ce9175b5"

# VLESS 入口地址（@ 后面的 host:port）
# ENTRY_HOST = "saas.sin.fan"
# ENTRY_PORT = "443"

# TLS SNI / WebSocket Host
# SNI = "snip.edgeoneai.cc.cd"
# FP  = "chrome"
# ALPN = "h3,h2"

# 传输类型：ws 或 xhttp
# TYPE = "ws"

# Early Data 长度（写进 path 的 ed 参数）
# ED = "2560"

# SSTP / PPP 的 PAP 账号密码（VPNGate 公共节点固定 vpn / vpn）
# SSTP_USER = "vpn"
# SSTP_PASS = "vpn"

# 备注模板，可用 {country} {name} {host} {port}
# REMARK = "vpngate.me | {country} | {name}"

# 输入只写了主机名、没写端口时使用的默认端口
# DEFAULT_PORT = "443"

# 单次最多检测多少个节点（1~500）
# MAX_NODES = "200"

# 并发数（1~60）
# CONCURRENCY = "20"

# 单节点超时秒数（3~30）
# TIMEOUT = "12"

# 整轮检测最大时长秒数（10~600）
# MAX_DURATION = "240"

# 是否强制走落地：path 末尾追加 global=1（1=开，其他=关）
# GLOBAL = "0"

# ---------- 可选：自定义域名（部署后拿到 *.workers.dev 再回来填） ----------
# [[routes]]
# pattern = "vpngate-test.example.com"
# custom_domain = true
